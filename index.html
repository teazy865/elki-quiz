<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Тест по методичке: Ёлки и пихты</title>
<style>
  :root { --green: #22c55e; --red: #ef4444; --bg: #f8fafc; --card: #ffffff; --text: #1e293b; }
  * { box-sizing: border-box; }
  body { font-family: system-ui, -apple-system, sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 16px; line-height: 1.5; }
  .container { max-width: 720px; margin: 0 auto; }
  h1 { text-align: center; font-size: 1.6rem; margin-bottom: 8px; }
  .subtitle { text-align: center; color: #64748b; margin-bottom: 24px; }
  .question { background: var(--card); border-radius: 16px; padding: 20px; margin-bottom: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
  .q-title { font-weight: 700; font-size: 1.1rem; margin-bottom: 12px; }
  .options { display: flex; flex-direction: column; gap: 10px; }
  button.option {
    background: #f1f5f9; border: 2px solid transparent; border-radius: 12px; padding: 14px 16px;
    text-align: left; font-size: 1rem; cursor: pointer; transition: all 0.15s; width: 100%;
  }
  button.option:hover:not(:disabled) { background: #e2e8f0; }
  button.option.correct {
    background: #dcfce7 !important;
    border-color: #22c55e !important;
    color: #166534 !important;
  }
  button.option.wrong {
    background: #fee2e2 !important;
    border-color: #ef4444 !important;
    color: #991b1b !important;
  }
  button.option:disabled { cursor: default; opacity: 1; }
  .explanation {
    margin-top: 12px; padding: 12px 14px; background: #f0fdf4; border-left: 4px solid var(--green);
    border-radius: 8px; font-size: 0.95rem; display: none;
  }
  .explanation.show { display: block; }
  .nav { display: flex; gap: 12px; margin-top: 16px; }
  .nav button {
    flex: 1; padding: 14px; border: none; border-radius: 12px; font-size: 1rem; font-weight: 600;
    cursor: pointer; background: #3b82f6; color: white;
  }
  .nav button:disabled { background: #cbd5e1; cursor: not-allowed; }
  .score { text-align: center; font-size: 1.2rem; margin: 20px 0; font-weight: 600; }
  .restart { display: block; margin: 20px auto; padding: 12px 24px; background: #3b82f6; color: white;
    border: none; border-radius: 12px; font-size: 1rem; cursor: pointer; }
  .progress { height: 6px; background: #e2e8f0; border-radius: 3px; margin-bottom: 20px; overflow: hidden; }
  .progress-bar { height: 100%; background: #3b82f6; width: 0%; transition: width 0.3s; }
</style>
</head>
<body>
<div class="container">
  <h1>Тест по методичке</h1>
  <p class="subtitle">Ёлки и пихты · 50 случайных вопросов</p>
  <div class="progress"><div class="progress-bar" id="progress"></div></div>
  <div id="quiz"></div>
  <div class="score" id="score"></div>
  <button class="restart" id="restart" style="display:none" onclick="startQuiz()">Новый тест</button>
</div>

<script>
const allQuestions = [
  {q:"Какой вид держит вид дольше всех (4–6 недель+)?", options:["Пихта Нордмана","Пихта Фразера","Канадская сосна","Норвежская ель"], correct:1, explain:"Пихта Фразера — самый долгий срок. Практически не осыпается и имеет яркий хвойно-цитрусовый аромат."},
  {q:"У какой пихты почти нет запаха?", options:["Фразера","Нордмана","Канадской сосны","Сибирской"], correct:1, explain:"У Нордмана запах утончённый, почти неуловимый. Если клиенту важен запах — предлагаем букеты сибирской пихты."},
  {q:"Какой приоритет продажи у пихты Нордмана?", options:["+++","++++","+++++","+"], correct:2, explain:"Нордман — высший приоритет (+++++). Самая пышная, премиальная, почти не осыпается."},
  {q:"Что делать, если клиент впервые заказывает и смотрит на норвежскую или голубую ель?", options:["Сразу продавать ель","Предложить скидку","Переключить на Нордман / Фразер / Канадку","Сказать, что ель лучше"], correct:2, explain:"Если клиент заказывает впервые — сразу переключаем на топы (Нордман, Фразер, Канадка). Они дольше держат вид и меньше сыплются."},
  {q:"Какая ёлка сильно осыпается и держит вид всего 1–2 недели?", options:["Нордман","Фразер","Канадская сосна","Норвежская и голубая ель"], correct:3, explain:"Норвежская и голубая ель держат вид 1–2 недели и сильно осыпаются. Российские — ещё хуже."},
  {q:"Для каких деревьев можно использовать песок + ведро вместо подставки?", options:["Для всех","Только для пихт","Только для русской ели и сосны","Только для канадской сосны"], correct:2, explain:"Песок + ведро — только для русской ели и сосны. Остальные тяжёлые и упадут."},
  {q:"Что делать, если клиента смущает слабый запах Нордмана?", options:["Предложить другую пихту","Сразу предложить букеты сибирской пихты","Сказать, что запаха и не будет","Дать скидку"], correct:1, explain:"Если смущает запах — сразу предлагаем букеты сибирской пихты (самый ароматный вариант)."},
  {q:"Какой лапник самый ароматный?", options:["Нобилис","Сибирская пихта","Ветки Нордмана","Сосновый"], correct:1, explain:"Сибирская пихта — самый ароматный. Держит 1–2 недели, запах как пихтовое масло."},
  {q:"Какой лапник лучше всего подходит для декора (венки, композиции)?", options:["Сибирская пихта","Нобилис","Еловый","Сосновый"], correct:1, explain:"Нобилис — основной для декора. Долго держит вид, почти не осыпается и почти не пахнет."},
  {q:"Какие услуги предлагаем после выбора ёлки?", options:["Только установку","Подрубку, установку и утилизацию","Только утилизацию","Никаких, если клиент не спросил"], correct:1, explain:"После выбора ёлки предлагаем все 3 услуги подряд: подрубку ствола, установку и утилизацию. Обычно берут все сразу."},
  {q:"Как измеряется высота срезанной ёлки?", options:["От пола до макушки","От начала ствола до кончиков последнего ряда веток","По самому длинному отростку","От земли до верхушки"], correct:1, explain:"Срезка — от начала ствола до кончиков последнего ряда веток. Горшок — от пола до макушки."},
  {q:"Что говорит клиенту, если он просит скидку?", options:["Даём 10%","У нас самое премиальное качество и сервис — снижение цены ударит по качеству","Скидка только на ели","Скидок нет вообще"], correct:1, explain:"Скидки не даём. Аргумент: премиальное качество и сервис."},
  {q:"Какой приоритет у канадской сосны?", options:["+++","++++","+++++","+"], correct:1, explain:"Канадская сосна — приоритет ++++. Супер пышная, премиум, практически не осыпается."},
  {q:"Сколько держит вид норвежская ель?", options:["4–6 недель","2–3 недели","1–2 недели","более 6 недель"], correct:2, explain:"Норвежская ель держит вид 1–2 недели+, редко больше. Сильно осыпается."},
  {q:"Какой аромат у пихты Фразера?", options:["Почти нет","Яркий хвойный","Хвойно-цитрусовый","Слабый хвойный"], correct:2, explain:"Пихта Фразера имеет яркий хвойно-цитрусовый аромат."},
  {q:"Какой бюджет у российской сосны?", options:["Премиум","Средний+","Эконом — средний-","Супер премиум"], correct:2, explain:"Российская сосна — бюджет эконом — средний-. Приоритет +."},
  {q:"Что предупреждаем при доставке ели до 15 декабря?", options:["Что будет свежая","Что до НГ скорее всего не доживёт","Что нужна подставка","Ничего"], correct:1, explain:"Если доставка до 15.12 — предупреждаем, что до Нового года скорее всего не доживёт."},
  {q:"Какой лапник держит вид 3–4 недели и почти не сыплется?", options:["Сибирская пихта","Нобилис","Ветки Нордмана / Фразера","Еловый"], correct:2, explain:"Ветки Нордмана и Фразера — высокий сегмент, держат 3–4 недели, почти не сыплются."},
  {q:"Сколько колпачков средства на литр воды?", options:["1","2","3","5"], correct:1, explain:"Средство для ёлки: 2 колпачка на литр воды. Одного флакона хватает на сезон."},
  {q:"Какой шаг измерения до 3 метров?", options:["10 см","25 см","50 см","100 см"], correct:1, explain:"До 3 м шаг 25 см, свыше 3 м — 50 см."},
  {q:"Какой приоритет у российской ели?", options:["+++++","++++","+++","+"], correct:3, explain:"Российская ель — приоритет +. Сильно осыпается, держит 1–2 недели."},
  {q:"Что делает подрубка ствола?", options:["Украшает","Делает свежий спил и снимает часть коры","Красит в краску","Ничего"], correct:1, explain:"Подрубка: на складе снимается часть коры и делается свежий спил. Дерево лучше пьёт воду и легче ставится в подставку."},
  {q:"Какой лапник сыплется сильно с начала?", options:["Нобилис","Сибирская пихта","Еловый","Сосновый"], correct:2, explain:"Еловый лапник — бюджетный, сыплется сильно с начала."},
  {q:"Какой приоритет продажи основной?", options:["Российские → Ели → Пихты","Нордман → Фразер → Канадка → Ели → Российские","Ели → Пихты","Все одинаково"], correct:1, explain:"Приоритет продажи: Нордман → Фразер → Канадка → ели → российские."},
  {q:"Какой размерный диапазон у канадской сосны?", options:["100–300 см","175–250 см","100–700 см","50–100 см"], correct:1, explain:"Канадская сосна: размеры 175–250 см."},
  {q:"Что такое коврик-мешок?", options:["Подставка","Мешок для утилизации с завязками","Средство","Лапник"], correct:1, explain:"Коврик-мешок — большой мешок с отверстиями и завязками для утилизации после сезона."},
  {q:"Какой запах у канадской сосны?", options:["Почти нет","Хвойно-цитрусовый","Яркий хвойный","Слабый"], correct:2, explain:"Канадская сосна имеет яркий хвойный аромат."},
  {q:"Что делаем всегда при продаже?", options:["Даём скидку","Максимум допов","Предлагаем только ёлку","Ничего"], correct:1, explain:"Всегда максимум допов. Скидки не даём."},
  {q:"Какой вид у российской ели?", options:["Супер пышная","Умеренный, ветки редкие","Идеальная симметрия","Как у пихт"], correct:1, explain:"Российская ель — умеренный вид, ветки относительно редкие (как в советских фильмах)."},
  {q:"Какой бюджет у пихты Нордмана?", options:["Эконом","Средний","Средний+ / премиум","Супер эконом"], correct:2, explain:"Пихта Нордмана — бюджет средний+ / премиум. Приоритет +++++."},
  {q:"Что предлагаем для декора?", options:["Сибирскую пихту","Нобилис","Еловый лапник","Сосновый"], correct:1, explain:"Для декора — Нобилис. Для запаха и атмосферы — Сибирская пихта."},
  {q:"Какой размер у российской сосны?", options:["100–300 см","175–250 см","100–700 см","50–150 см"], correct:0, explain:"Российская сосна: размеры 100–300 см."},
  {q:"Что делает средство для ёлки?", options:["Красит иголки","Помогает дольше сохранять свежий вид на 20–30% и препятствует запаху воды","Делает ёлку выше","Ничего"], correct:1, explain:"Средство — концентрат питательных и антибактериальных веществ. Дольше свежий вид (+20–30%) и без неприятного запаха воды."},
  {q:"Какой приоритет у голубой ели?", options:["+++++","++++","+++","+"], correct:2, explain:"Голубая ель — приоритет +++. Держит 1–2 недели, сильно осыпается."},
  {q:"Что можно сделать с ветками Нордмана?", options:["Только выбросить","Прикрыть подставку или устелить под ёлкой","Ничего","Только для запаха"], correct:1, explain:"Ветки Нордмана / Фразера можно прикрыть подставку или устелить под ёлкой."},
  {q:"Какой клиент у российской ели?", options:["Супер премиум","От эконом до среднего","Только премиум","Бизнес"], correct:1, explain:"Российская ель: клиент от эконом до среднего. Важно запах, экономия, «чтобы была ёлка»."},
  {q:"Какой лапник почти не пахнет?", options:["Сибирская пихта","Нобилис","Сосновый","Еловый"], correct:1, explain:"Нобилис долго держит вид, почти не осыпается, почти не пахнет."},
  {q:"Какой размер у пихты Фразера?", options:["100–700 см","100–250 см+","175–250 см","100–300 см"], correct:1, explain:"Пихта Фразера: размеры 100–250 см+."},
  {q:"Что делаем при сомнении клиента в услугах?", options:["Даём скидку","Аккуратно намекаем, что установка и утилизация трудоёмки","Ничего","Отказываем"], correct:1, explain:"Если клиент сомневается — аккуратно намекаем, что установка и утилизация трудоёмки. Обычно берут все три сразу."},
  {q:"Какой запах у голубой ели?", options:["Цитрусовый","Хвойный","Почти нет","Яркий как масло"], correct:1, explain:"Голубая ель имеет хвойный аромат."},
  {q:"Какой размер у норвежской ели?", options:["100–250 см+","175–250 см","100–700 см","100–300 см"], correct:0, explain:"Норвежская ель: размеры 100–250 см+."},
  {q:"Что такое СТ1–СТ3?", options:["Лапники","Подставки для ёлок до ~3,5 м","Средства","Услуги"], correct:1, explain:"СТ1–СТ3 — постоянный ассортимент подставок до ~3,5 м. СТ4 — для больших уличных."},
  {q:"Какой приоритет у пихты Фразера?", options:["+++++","++++","+++","+"], correct:1, explain:"Пихта Фразера — приоритет ++++. Самый долгий срок."},
  {q:"Что важно клиенту российской сосны?", options:["Премиум вид","Запах, экономия, чтобы была ёлка","Долгий срок","Мягкие иголки"], correct:1, explain:"Клиент российской сосны: от эконом до среднего. Важно запах, экономия, «чтобы была ёлка»."},
  {q:"Какой лапник желтеет умеренно?", options:["Еловый","Сосновый","Нобилис","Сибирская пихта"], correct:1, explain:"Сосновый лапник — бюджетный, желтеет умеренно."},
  {q:"Какой размер у пихты Нордмана?", options:["100–250 см","175–250 см","100–700 см","100–300 см"], correct:2, explain:"Пихта Нордмана: размеры 100–700 см."},
  {q:"Что предлагаем с Нордманом особенно?", options:["Скидку","Букеты сибирской пихты","Другую пихту","Ничего"], correct:1, explain:"С Нордманом особенно уместны букеты сибирской пихты (поставить в вазу или под ёлку)."},
  {q:"Какой приоритет у норвежской ели?", options:["+++++","++++","+++","+"], correct:2, explain:"Норвежская ель — приоритет +++."},
  {q:"Какой лапник самый ароматный и запах как пихтовое масло?", options:["Нобилис","Сибирская пихта","Ветки Фразера","Сосновый"], correct:1, explain:"Сибирская пихта — самый ароматный. Запах как пихтовое масло."},
  {q:"Какой бюджет у канадской сосны?", options:["Эконом","Средний+","Средний+ / премиум","Супер эконом"], correct:2, explain:"Канадская сосна — бюджет средний+ / премиум."},
  {q:"Что делаем, если клиент не знает про услуги?", options:["Ничего","Обязательно предлагаем все 3 услуги","Даём скидку","Отказываем"], correct:1, explain:"Если не предложить — клиент может просто не знать, что такие услуги есть. После выбора ёлки предлагаем все 3."},
  {q:"Какой иголки у пихт Нордмана и Фразера?", options:["Короткие колючие","Мягкие тёмно-зелёные","Длинные колючие","Жёсткие"], correct:1, explain:"У пихт Нордмана и Фразера иголки мягкие, тёмно-зелёные."},
  {q:"Какой приоритет у российской сосны?", options:["+++++","++++","+++","+"], correct:3, explain:"Российская сосна — приоритет +."},
  {q:"Какой лапник для запаха и атмосферы?", options:["Нобилис","Сибирская пихта","Еловый","Ветки Нордмана"], correct:1, explain:"Для запаха и атмосферы — Сибирская пихта."},
  {q:"Какой бюджет у норвежской ели?", options:["Эконом","Средний+","Средний","Премиум"], correct:1, explain:"Норвежская ель — бюджет средний+."},
  {q:"Какой иголки у канадской сосны?", options:["Мягкие","Длинные колючие тёмно-зелёные","Короткие мягкие","Жёсткие короткие"], correct:1, explain:"Канадская сосна: иголки длинные, колючие, тёмно-зелёные."},
  {q:"Какой размер у российской ели?", options:["100–300 см","175–250 см","100–700 см","100–250 см"], correct:0, explain:"Российская ель: размеры 100–300 см."},
  {q:"Что делаем всегда при запахе?", options:["Даём скидку","Сразу букеты сибирской пихты","Ничего","Предлагаем ель"], correct:1, explain:"Если смущает запах — сразу букеты сибирской пихты."}
];

function shuffle(array) {
  const a = [...array];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

let questions = [];
let current = 0;
let score = 0;
let answers = [];

function startQuiz() {
  questions = shuffle(allQuestions).slice(0, 50);
  current = 0;
  score = 0;
  answers = new Array(questions.length).fill(null);
  document.getElementById("score").textContent = "";
  document.getElementById("restart").style.display = "none";
  renderQuestion();
}

function updateProgress() {
  const answeredCount = answers.filter(a => a !== null).length;
  const pct = (answeredCount / questions.length) * 100;
  document.getElementById("progress").style.width = pct + "%";
}

function renderQuestion() {
  if (current >= questions.length) {
    showResult();
    return;
  }
  const q = questions[current];
  const selected = answers[current];
  const quiz = document.getElementById("quiz");

  quiz.innerHTML = `
    <div class="question">
      <div class="q-title">${current + 1} / ${questions.length}. ${q.q}</div>
      <div class="options" id="opts"></div>
      <div class="explanation ${selected !== null ? 'show' : ''}" id="explain">${q.explain}</div>
      <div class="nav">
        <button onclick="prev()" ${current === 0 ? 'disabled' : ''}>← Назад</button>
        <button onclick="next()" ${selected === null ? 'disabled' : ''}>Далее →</button>
      </div>
    </div>
  `;

  const opts = document.getElementById("opts");
  q.options.forEach((opt, i) => {
    const btn = document.createElement("button");
    btn.className = "option";
    btn.textContent = opt;
    if (selected !== null) {
      btn.disabled = true;
      if (i === q.correct) btn.classList.add("correct");
      else if (i === selected) btn.classList.add("wrong");
    } else {
      btn.onclick = () => select(i);
    }
    opts.appendChild(btn);
  });

  updateProgress();
}

function select(idx) {
  if (answers[current] !== null) return;
  answers[current] = idx;
  if (idx === questions[current].correct) score++;
  renderQuestion();
}

function next() {
  if (answers[current] === null) return;
  if (current < questions.length - 1) {
    current++;
    renderQuestion();
  } else {
    current = questions.length;
    showResult();
  }
}

function prev() {
  if (current > 0) {
    current--;
    renderQuestion();
  }
}

function showResult() {
  const quiz = document.getElementById("quiz");
  quiz.innerHTML = "";
  document.getElementById("score").innerHTML = `Результат: <strong>${score} из ${questions.length}</strong>`;
  document.getElementById("progress").style.width = "100%";
  document.getElementById("restart").style.display = "block";
}

startQuiz();
</script>
</body>
</html>
